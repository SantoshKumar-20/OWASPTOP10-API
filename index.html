      {
        id: "API1",
        title: "API1:2023 Broken Object Level Authorization (BOLA)",
        severity: "High",
        description: "Occurs when an API does not perform appropriate authorization checks when accessing individual objects via IDs, exposing internal objects to unauthorized requests.",
        concept: "APIs commonly expose endpoints that handle object identifiers (e.g., `/api/v1/trips/{trip_id}`). An attacker alters the ID parameter to point to a resource they do not own, and the lack of validation on the backend allows them to retrieve or modify data belonging to other users.",
        remediation: [
          "Implement a robust authorization mechanism that validates if the logged-in user owns or has access rights to the specific object ID requested.",
          "Avoid relying on client-supplied keys/IDs without verification on the server-side.",
          "Use random, unguessable UUIDv4 values as object identifiers instead of sequential integers.",
          "Write comprehensive authorization tests for all endpoints that access identifiers."
        ],
        vulnerableCode: `// Express.js Vulnerable Code
app.get('/api/users/profile', async (req, res) => {
  // Vulnerability: Reads user ID directly from query/parameter or body,
  // without validating if the current session owner matches this ID.
  const userId = req.query.userId;
  
  const user = await db.findUserById(userId);
  if (!user) return res.status(404).json({ error: 'User not found' });
  
  res.json(user); // Returns arbitrary profile without checking authorization
});`,
        secureCode: `// Express.js Secure Code (Mitigated)
app.get('/api/users/profile', authenticateToken, async (req, res) => {
  // Mitigation 1: Retrieve user identity from verified session token (JWT/Session)
  const currentUserId = req.user.id; 
  const requestedUserId = req.query.userId;

  // Mitigation 2: Explicitly validate the session user matches the requested resource
  if (currentUserId !== requestedUserId && req.user.role !== 'admin') {
    return res.status(403).json({ error: 'Forbidden: You do not own this resource' });
  }

  const user = await db.findUserById(requestedUserId);
  if (!user) return res.status(404).json({ error: 'User not found' });

  res.json(user);
});`
      },
      {
        id: "API2",
        title: "API2:2023 Broken Authentication",
        severity: "High",
        description: "Occurs when authentication mechanisms are poorly implemented, allowing attackers to compromise authentication tokens or exploit implementation flaws to assume identities.",
        concept: "Authentication flows (such as login, password reset, or API key usage) are highly targeted. Common issues include lack of rate-limiting on login endpoints, exposing JWTs in URLs, using weak signature keys, or failing to validate token expiration.",
        remediation: [
          "Use established authentication standards (OAuth 2.0, OpenID Connect, standard JWT libraries).",
          "Always enforce rate limiting on password reset, verification code, and login endpoints.",
          "Implement robust password complexity controls and support multi-factor authentication (MFA).",
          "Never put sensitive auth identifiers (tokens, session IDs) in query strings or URL paths."
        ],
        vulnerableCode: `// Express.js Vulnerable Login Endpoint
app.post('/api/auth/login', async (req, res) => {
  const { username, password } = req.body;
  
  // Vulnerability 1: Lack of rate limiting allows brute force attacks.
  // Vulnerability 2: Poor credential check or insecure token expiration.
  const user = await db.findUserByUsername(username);
  if (user && user.password === password) { // plaintext password check
    const token = jwt.sign({ id: user.id }, 'weak_secret_key'); // weak secret key
    return res.json({ token });
  }
  
  res.status(401).json({ error: 'Invalid credentials' });
});`,
        secureCode: `// Express.js Secure Login Endpoint
const rateLimit = require('express-rate-limit');
const bcrypt = require('bcrypt');

// Mitigation 1: Enforce strict rate-limiting on authentication routes
const loginLimiter = rateLimit({
  windowMs: 15 * 60 * 1000, // 15 minutes
  max: 5, // Limit each IP to 5 login requests per window
  message: 'Too many login attempts, please try again later'
});

app.post('/api/auth/login', loginLimiter, async (req, res) => {
  const { username, password } = req.body;
  
  const user = await db.findUserByUsername(username);
  if (!user) return res.status(401).json({ error: 'Invalid credentials' });

  // Mitigation 2: Securely verify cryptographic hashes, not plaintext
  const isMatch = await bcrypt.compare(password, user.passwordHash);
  if (!isMatch) return res.status(401).json({ error: 'Invalid credentials' });

  // Mitigation 3: Sign tokens with strong system secrets and explicit expiration
  const token = jwt.sign(
    { id: user.id }, 
    process.env.JWT_STRONG_SECRET, 
    { expiresIn: '1h', algorithm: 'HS256' }
  );

  res.json({ token });
});`
      },
      {
        id: "API3",
        title: "API3:2023 Broken Object Property Level Authorization (BOPLA)",
        severity: "Medium",
        description: "Occurs when endpoints expose too much internal object property data (Excessive Data Exposure) or accept modification of unauthorized internal properties (Mass Assignment).",
        concept: "BOPLA combines two classic issues: Excessive Data Exposure (where the server returns more properties of an object than necessary, assuming the frontend will filter it) and Mass Assignment (where clients send property updates to fields they shouldn't edit, like `isAdmin = true`).",
        remediation: [
          "Avoid returning full database model serialization directly. Define Data Transfer Objects (DTOs) or explicitly select returned fields.",
          "Avoid blindly binding client-supplied requests directly to internal objects (`req.body`).",
          "Whitelist permitted properties that can be modified by the client."
        ],
        vulnerableCode: `// Express.js BOPLA Vulnerabilities
// 1. Excessive Data Exposure (GET)
app.get('/api/users/:id', async (req, res) => {
  const user = await db.findUser(req.params.id);
  res.json(user); // Vulnerability: returns user.passwordHash, resetToken, role, etc.
});

// 2. Mass Assignment (PUT)
app.put('/api/users/:id', async (req, res) => {
  const user = await db.findUser(req.params.id);
  // Vulnerability: Blindly copies req.body parameters onto the database entity.
  // Attackers can pass {"role": "admin"} or {"balance": 99999}.
  Object.assign(user, req.body);
  await db.save(user);
  res.json(user);
});`,
        secureCode: `// Express.js BOPLA Mitigations
// 1. Safe Projection (GET)
app.get('/api/users/:id', async (req, res) => {
  const user = await db.findUser(req.params.id);
  
  // Mitigation: Return only safe public properties (DTO pattern)
  const safeProfile = {
    id: user.id,
    username: user.username,
    displayName: user.displayName,
    avatarUrl: user.avatarUrl
  };
  res.json(safeProfile);
});

// 2. Strict Whitelisting (PUT)
app.put('/api/users/:id', authenticateToken, async (req, res) => {
  const user = await db.findUser(req.params.id);
  
  // Mitigation: Explicitly destructure only allowed properties
  const { displayName, avatarUrl } = req.body;
  
  // Only apply properties client is authorized to modify
  if (displayName) user.displayName = displayName;
  if (avatarUrl) user.avatarUrl = avatarUrl;
  
  await db.save(user);
  res.json({ message: 'Profile updated successfully' });
});`

        id: "API4",
        title: "API4:2023 Unrestricted Resource Consumption",
        severity: "Medium",
        description: "Occurs when API endpoints are not protected against excessive volume requests, file uploads, payload sizes, or intensive processing, causing Denial of Service (DoS) or increased cloud bills.",

        remediation: [
          "Enforce maximum execution timeouts, upload limits, and request payload size limits.",
          "Implement pagination with hard ceilings (e.g., maximum page size of 50).",
          "Apply API rate limiting (throttling) globally and on resource-heavy routes.",
          "Limit CPU/Memory footprints on third-party operations (like image rendering)."
        ],
        vulnerableCode: `// Express.js Vulnerable Server
// Vulnerability 1: Lack of global rate limiting or payload limits
app.post('/api/image/resize', async (req, res) => {
  // Vulnerability 2: Reading unlimited page size from client request
  const pageSize = req.query.limit || 1000000;
  
  const records = await db.fetchRecords(pageSize);
  res.json(records); // Heavy SQL load + memory exhaustion
});`,
        secureCode: `// Express.js Secured Config
const express = require('express');
const app = express();

// Mitigation 1: Define explicit JSON payload size limit globally
app.use(express.json({ limit: '10kb' })); 

// Mitigation 2: Enforce query bounds in API logic
app.get('/api/records', async (req, res) => {
  let limit = parseInt(req.query.limit, 10) || 20;
  
  // Hard ceiling: Client cannot request more than 100 items at a time
  if (limit > 100) {
    limit = 100;
  }
  
  const page = parseInt(req.query.page, 10) || 1;
  const offset = (page - 1) * limit;

  const records = await db.fetchRecords(limit, offset);
  res.json({ data: records, page, limit });
});`
      },
      {
        id: "API5",
        title: "API5:2023 Broken Function Level Authorization (BFLA)",
        severity: "High",
        description: "Occurs when authentication and access control policies do not validate authorization based on hierarchies or functional access levels (e.g. general user calling administrative routes).",
        concept: "BFLA happens when administrative or specialized endpoints are exposed without verifying the role of the caller. Attackers search for administration functions (e.g. changing `/api/v1/user/details` to `/api/v1/admin/delete_user`) and call them directly by guessing the path structure.",
        remediation: [
          "Implement a centralized access control middleware to map routes to roles (RBAC/ABAC).",
          "By default, deny all access; explicitly authorize roles for sensitive API administrative endpoints.",
          "Perform thorough testing to ensure normal users cannot invoke administrative actions."
        ],
        vulnerableCode: `// Express.js BFLA Vulnerability
// Regular user actions are checked, but administrative functions are not restricted
app.post('/api/admin/users/:id/delete', async (req, res) => {
  // Vulnerability: Only verifies authentication token exists,
  // but fails to verify if user's role is 'admin'.
  const user = req.user; 
  if (!user) return res.status(401).json({ error: 'Unauthorized' });

  await db.deleteUser(req.params.id);
  res.json({ message: 'User deleted' });
});`,
        secureCode: `// Express.js BFLA Mitigations
// Helper RBAC middleware to enforce roles
const requireRole = (allowedRoles) => {
  return (req, res, next) => {
    if (!req.user || !allowedRoles.includes(req.user.role)) {
      return res.status(403).json({ 
        error: 'Forbidden: You do not have permissions for this action' 
      });
    }
    next();
  };
};

// Administrative function explicitly restricts access to authorized roles
app.post(
  '/api/admin/users/:id/delete', 
  authenticateToken, 
  requireRole(['admin']), // Mitigation: Explicit authorization check
  async (req, res) => {
    await db.deleteUser(req.params.id);
    res.json({ message: 'User deleted successfully' });
  }
);`
      },
      {
        id: "API6",
        title: "API6:2023 Unrestricted Access to Sensitive Business Flows",
        severity: "Medium",
        description: "Occurs when an API exposes sensitive business workflows without adequate safeguards, allowing malicious actors to automate and abuse logic (e.g. buying out ticket stocks, spamming SMS, index scraping).",

        vulnerableCode: `// Express.js Vulnerable Business Flow
app.post('/api/reminders/sms', async (req, res) => {

        secureCode: `// Express.js Protected Business Flow

app.post('/api/reminders/sms', authenticateToken, smsLimiter, async (req, res) => {

  if (!req.body.captchaToken) {

        id: "API7",
        title: "API7:2023 Server Side Request Forgery (SSRF)",
        severity: "High",
        description: "Occurs when an API fetches a remote resource based on a client-provided URI without validating the destination, allowing attackers to force the application to send requests to internal resources.",
        concept: "Server Side Request Forgery occurs when the server acts as a proxy to fetch a URL provided by the user. If the user provides a local IP (e.g. `http://127.0.0.1:8500`) or metadata addresses (like AWS IMDS `http://169.254.169.254`), the server might fetch it, leaking internal configuration data.",
        remediation: [
          "Validate and restrict client-provided URLs to an explicit whitelist of allowed domains.",
          "Block requests pointing to internal subnets, localhost, and non-routable ranges (RFC 1918).",
          "Do not forward raw HTTP responses or metadata from remote lookups directly to the client."
        ],
        vulnerableCode: `// Express.js SSRF Vulnerability

app.post('/api/preview-image', async (req, res) => {

  try {
    // Vulnerability: Axios requests the remote site directly.
    // An attacker can pass 'http://169.254.169.254/latest/meta-data/'

    const response = await axios.get(imageUrl);
    res.send(response.data);
  } catch (err) {
    res.status(500).send(err.message);
  }
});`,
        secureCode: `// Express.js SSRF Mitigation
const axios = require('axios');
const ip = require('ip');
const { URL } = require('url');

app.post('/api/preview-image', async (req, res) => {
  const { imageUrl } = req.body;

  try {
    const parsedUrl = new URL(imageUrl);
    
    // Mitigation 1: Enforce HTTPS scheme only
    if (parsedUrl.protocol !== 'https:') {
      return res.status(400).json({ error: 'Only HTTPS protocol is supported' });
    }

    // Mitigation 2: Restrict allowed domains if possible
    const allowedDomains = ['images.unsplash.com', 'res.cloudinary.com'];
    if (!allowedDomains.includes(parsedUrl.hostname)) {
      return res.status(400).json({ error: 'Domain is not whitelisted' });
    }

    // Mitigation 3: Resolve IP and block private/non-routable/internal networks
    const dns = require('dns').promises;
    const lookup = await dns.lookup(parsedUrl.hostname);
    const destinationIp = lookup.address;

    if (ip.isPrivate(destinationIp) || ip.isLoopback(destinationIp)) {
      return res.status(403).json({ error: 'Access to internal IP address is forbidden' });
    }

    const response = await axios.get(imageUrl, { timeout: 3000 });
    res.send(response.data);
  } catch (err) {
    res.status(500).json({ error: 'Failed to fetch image preview' });
  }
});`

        secureCode: `// Express.js Secure Integration
const axios = require('axios');
const validator = require('validator');

app.post('/api/weather/report', async (req, res) => {
  try {
    const response = await axios.get('https://api.external-weather.com/today', {
      timeout: 5000 // Mitigation 1: Enforce strict connection timeout
    });

    const rawForecast = response.data.summary;

    // Mitigation 2: Sanitize and validate external input before processing
    if (typeof rawForecast !== 'string' || !validator.isAlphanumeric(rawForecast.replace(/\\s/g, ''))) {
      return res.status(422).json({ error: 'Invalid response signature from external provider' });
    }

    // Mitigation 3: Use parameterized database queries to prevent SQL injection

                    {selectedVuln.severity} Severity
                  </span>
                </div>

                {/* Navigation Tabs */}
                <div className="flex border-b border-slate-800/60 -mx-6 px-6">
                  {[
                    { id: 'overview', label: 'Overview', icon: 'book-open' },
                    { id: 'code', label: 'Code Comparison', icon: 'code-2' },
                    { id: 'simulation', label: 'Live HTTP Playground', icon: 'play' }
                  ].map((tab) => (
                    <button
                      key={tab.id}
                      onClick={() => setActiveTab(tab.id)}
                      className={`flex items-center gap-2 py-3 px-4 border-b-2 text-sm font-medium transition-all ${
                        activeTab === tab.id
                          ? 'border-blue-500 text-blue-400'
                          : 'border-transparent text-slate-400 hover:text-slate-200'
                      }`}
                    >
                      <i data-lucide={tab.icon} className="w-4 h-4"></i>
                      {tab.label}
                    </button>
                  ))}
                </div>

                {/* Tab Contents */}
                <div className="pt-2">
                  
                  {/* OVERVIEW TAB */}
                  {activeTab === 'overview' && (
                    <div className="space-y-6">
                      <div>
                        <h3 className="text-sm font-semibold text-slate-300 uppercase tracking-wider mb-2">Vulnerability Concept</h3>
                        <p className="text-slate-300 text-sm leading-relaxed">{selectedVuln.concept}</p>
                      </div>

                      <div className="bg-slate-900/60 border border-slate-800 rounded-xl p-4">
                        <h3 className="text-sm font-semibold text-slate-300 mb-3 flex items-center gap-2">
                          <i data-lucide="shield-check" className="w-4 h-4 text-emerald-500"></i>
                          Defensive Remediation Checklist
                        </h3>
                        <ul className="space-y-2.5">
                          {selectedVuln.remediation.map((item, idx) => (
                            <li key={idx} className="flex gap-2.5 text-xs text-slate-400 items-start">
                              <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 mt-1.5 shrink-0"></span>
                              <span>{item}</span>
                            </li>
                          ))}
                        </ul>
                      </div>
                    </div>
                  )}

                  {/* CODE TAB */}
                  {activeTab === 'code' && (
                    <div className="space-y-6">
                      <p className="text-xs text-slate-400 leading-relaxed">
                        Compare the differences in structural design patterns. See how neglecting input controls introduces vulnerabilities, and how defensive design patterns close the gap.
                      </p>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {/* Vulnerable Code Card */}
                        <div className="flex flex-col border border-red-950/60 bg-red-950/10 rounded-xl overflow-hidden">
                          <div className="bg-brand-dangerBg/50 border-b border-red-950/60 px-4 py-2 flex items-center gap-2">
                            <i data-lucide="x-circle" className="text-red-400 w-4 h-4"></i>
                            <span className="text-xs font-semibold text-red-400 font-mono">Vulnerable Logic</span>
                          </div>
                          <pre className="p-4 text-xs font-mono overflow-x-auto text-red-200/90 whitespace-pre-wrap select-all leading-relaxed bg-black/35 flex-1">
                            {selectedVuln.vulnerableCode}
                          </pre>
                        </div>

                        {/* Secure Code Card */}
                        <div className="flex flex-col border border-emerald-950/60 bg-emerald-950/10 rounded-xl overflow-hidden">
                          <div className="bg-brand-safeBg/50 border-b border-emerald-950/60 px-4 py-2 flex items-center gap-2">
                            <i data-lucide="check-circle-2" className="text-emerald-400 w-4 h-4"></i>
                            <span className="text-xs font-semibold text-emerald-400 font-mono">Mitigated Logic</span>
                          </div>
                          <pre className="p-4 text-xs font-mono overflow-x-auto text-emerald-200/90 whitespace-pre-wrap select-all leading-relaxed bg-black/35 flex-1">
                            {selectedVuln.secureCode}
                          </pre>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* SIMULATION TAB (LIVE HTTP CLIENT PLAYGROUND) */}
                  {activeTab === 'simulation' && (
                    <div className="space-y-6">
                      
                      {/* Safety Engine Switcher */}
                      <div className="flex items-center justify-between flex-wrap gap-3 bg-slate-900/60 border border-slate-800/80 px-4 py-3 rounded-xl">
                        <div>
                          <h4 className="text-sm font-semibold text-slate-300">Live HTTP Sandbox</h4>
                          <p className="text-xs text-slate-400">Modify the request parameters and execute tests on both code versions in real-time.</p>
                        </div>
                        
                        <div className="flex bg-slate-950 p-1 rounded-lg border border-slate-800">
                          <button
                            onClick={() => { setSimEngineSecure(false); setSimResponse(null); setSimLogs([]); setSimAttempts(0); }}
                            className={`text-xs px-3 py-1.5 rounded-md font-medium transition-all ${
                              !simEngineSecure 
                                ? 'bg-red-500/20 text-red-400 border border-red-900/30' 
                                : 'text-slate-400 hover:text-slate-200'
                            }`}
                          >
                            Vulnerable Code Engine
                          </button>
                          <button
                            onClick={() => { setSimEngineSecure(true); setSimResponse(null); setSimLogs([]); setSimAttempts(0); }}
                            className={`text-xs px-3 py-1.5 rounded-md font-medium transition-all ${
                              simEngineSecure 
                                ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-900/30' 
                                : 'text-slate-400 hover:text-slate-200'
                            }`}
                          >
                            Secure Code Engine
                          </button>
                        </div>
                      </div>

                      {/* Request Builder Grid */}
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        
                        {/* Request Builder (Left Pane) */}
                        <div className="border border-slate-800 rounded-xl p-5 bg-brand-card/30 flex flex-col justify-between min-h-[380px]">
                          <div>
                            <div className="flex items-center gap-2 mb-4 border-b border-slate-800 pb-2">
                              <i data-lucide="send" className="w-4 h-4 text-blue-500"></i>
                              <span className="text-xs font-semibold text-slate-300 uppercase tracking-wider">HTTP Request Client</span>
                            </div>
                            
                            {/* DYNAMIC FORM ACCORDING TO SELECTED VULNERABILITY */}
                            
                            {/* API1: BOLA */}
                            {selectedVuln.id === 'API1' && (
                              <div className="space-y-4">
                                <div className="flex items-center gap-2 bg-slate-950 p-2 rounded-lg border border-slate-800 font-mono text-xs text-slate-300">
                                  <span className="text-emerald-400 font-bold">GET</span>
                                  <span>/api/v1/profile</span>
                                </div>
                                <div>
                                  <label className="block text-xs font-semibold text-slate-400 mb-1.5">Query Parameters</label>
                                  <div className="flex gap-2 items-center bg-slate-900/60 rounded-lg p-2 border border-slate-800">
                                    <span className="text-xs text-slate-500 font-mono">?userId=</span>
                                    <input
                                      type="text"
                                      className="bg-transparent text-xs text-slate-200 focus:outline-none flex-1 font-mono"
                                      value={simInputs.API1.userId}
                                      onChange={(e) => updateSimInput('userId', e.target.value)}
                                    />
                                  </div>
                                  <span className="text-[10px] text-slate-500 mt-1 block">
                                    (Authenticated context: 102. Try changing value to <b>101</b> to attempt access bypass)
                                  </span>
                                </div>
                              </div>
                            )}

                            {/* API2: Broken Auth */}
                            {selectedVuln.id === 'API2' && (
                              <div className="space-y-4">
                                <div className="flex items-center gap-2 bg-slate-950 p-2 rounded-lg border border-slate-800 font-mono text-xs text-slate-300">
                                  <span className="text-amber-500 font-bold">POST</span>
                                  <span>/api/v1/auth/login</span>
                                </div>
                                <div>
                                  <label className="block text-xs font-semibold text-slate-400 mb-1">Username</label>
                                  <input type="text" disabled className="w-full bg-slate-900/40 border border-slate-800 rounded-lg p-2 text-xs font-mono text-slate-500" value="admin" />
                                </div>
                                <div>
                                  <label className="block text-xs font-semibold text-slate-400 mb-1">Password</label>
                                  <input
                                    type="text"
                                    placeholder="Type credential guess..."
                                    className="w-full bg-slate-900/60 border border-slate-800 rounded-lg p-2 text-xs font-mono text-slate-200 focus:outline-none focus:border-blue-500"
                                    value={simInputs.API2.password}
                                    onChange={(e) => updateSimInput('password', e.target.value)}
                                  />
                                  <span className="text-[10px] text-slate-500 mt-1 block">
                                    (Target password: <b>password123</b>. Test brute forcing repeatedly with random words)
                                  </span>
                                </div>
                                {simAttempts > 0 && (
                                  <div className="text-[10px] bg-slate-900 p-2 rounded border border-slate-800 font-mono text-slate-400">
                                    Total Login Requests Executed: <span className="text-amber-400 font-bold">{simAttempts}</span>
                                  </div>
                                )}
                              </div>
                            )}

                            {/* API3: BOPLA */}
                            {selectedVuln.id === 'API3' && (
                              <div className="space-y-4">
                                <div className="flex items-center gap-2 bg-slate-950 p-2 rounded-lg border border-slate-800 font-mono text-xs text-slate-300">
                                  <span className="text-blue-500 font-bold">PUT</span>
                                  <span>/api/v1/users/102</span>
                                </div>
                                <div>
                                  <label className="block text-xs font-semibold text-slate-400 mb-1.5">JSON Payload Body</label>
                                  <textarea
                                    rows="5"
                                    className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs font-mono text-emerald-400 focus:outline-none focus:border-blue-500"
                                    value={simInputs.API3.body}
                                    onChange={(e) => updateSimInput('body', e.target.value)}
                                  ></textarea>
                                  <span className="text-[10px] text-slate-500 mt-1 block">
                                    (Modify JSON properties. Try sending custom properties like <b>"role": "admin"</b>)
                                  </span>
                                </div>
                              </div>
                            )}

                            {/* API4: Resource Consumption */}
                            {selectedVuln.id === 'API4' && (
                              <div className="space-y-4">
                                <div className="flex items-center gap-2 bg-slate-950 p-2 rounded-lg border border-slate-800 font-mono text-xs text-slate-300">
                                  <span className="text-emerald-400 font-bold">GET</span>
                                  <span>/api/v1/records</span>
                                </div>
                                <div>
                                  <label className="block text-xs font-semibold text-slate-400 mb-1.5">Query Parameters</label>
                                  <div className="flex gap-2 items-center bg-slate-900/60 rounded-lg p-2 border border-slate-800">
                                    <span className="text-xs text-slate-500 font-mono">?limit=</span>
                                    <input
                                      type="number"
                                      className="bg-transparent text-xs text-slate-200 focus:outline-none flex-1 font-mono"
                                      value={simInputs.API4.limit}
                                      onChange={(e) => updateSimInput('limit', e.target.value)}
                                    />
                                  </div>
                                  <span className="text-[10px] text-slate-500 mt-1 block">
                                    (Test resource allocation. Try values like <b>25</b> vs a heavy load of <b>100000</b>)
                                  </span>
                                </div>
                              </div>
                            )}

                            {/* API5: BFLA */}
                            {selectedVuln.id === 'API5' && (
                              <div className="space-y-4">
                                <div>
                                  <label className="block text-xs font-semibold text-slate-400 mb-1.5">HTTP Request Target Endpoint Path</label>
                                  <div className="flex bg-slate-950 p-2 rounded-lg border border-slate-800 font-mono text-xs text-slate-300">
                                    <span className="text-amber-500 font-bold mr-2">POST</span>
                                    <select
                                      className="bg-transparent text-slate-200 focus:outline-none flex-1 font-mono text-xs cursor-pointer"
                                      value={simInputs.API5.path}
                                      onChange={(e) => updateSimInput('path', e.target.value)}
                                    >
                                      <option className="bg-slate-950 text-slate-200" value="/api/v1/user/profile">/api/v1/user/profile</option>
                                      <option className="bg-slate-950 text-slate-200" value="/api/v1/admin/delete_user">/api/v1/admin/delete_user</option>
                                    </select>
                                  </div>
                                  <span className="text-[10px] text-slate-500 mt-1 block">
                                    (Change route path to test privilege boundaries on administrative functions)
                                  </span>
                                </div>
                              </div>
                            )}

                            {/* API6: Sensitive Business Flows */}
                            {selectedVuln.id === 'API6' && (
                              <div className="space-y-4">
                                <div className="flex items-center gap-2 bg-slate-950 p-2 rounded-lg border border-slate-800 font-mono text-xs text-slate-300">
                                  <span className="text-amber-500 font-bold">POST</span>
                                  <span>/api/v1/reminders/sms</span>
                                </div>
                                <div className="text-xs text-slate-400 bg-slate-900/50 border border-slate-800 rounded-lg p-3">
                                  This request triggers the SMS validation gateway. Without rate limits, script bots can automate OTP triggers repeatedly.
                                </div>
                                {simAttempts > 0 && (
                                  <div className="text-[10px] bg-slate-900 p-2 rounded border border-slate-800 font-mono text-slate-400 flex flex-col gap-1">
                                    <div>SMS Requests sent: <span className="text-blue-400 font-bold">{simAttempts}</span></div>
                                    <div>Simulated Cost: <span className="text-amber-500 font-bold">${(simAttempts * 0.05).toFixed(2)}</span></div>
                                  </div>
                                )}
                              </div>
                            )}

                            {/* API7: SSRF */}
                            {selectedVuln.id === 'API7' && (
                              <div className="space-y-4">
                                <div className="flex items-center gap-2 bg-slate-950 p-2 rounded-lg border border-slate-800 font-mono text-xs text-slate-300">
                                  <span className="text-amber-500 font-bold">POST</span>
                                  <span>/api/v1/preview</span>
                                </div>
                                <div>
                                  <label className="block text-xs font-semibold text-slate-400 mb-1.5">Preview Resource URL</label>
                                  <input
                                    type="text"
                                    className="w-full bg-slate-900/60 border border-slate-800 rounded-lg p-2 text-xs font-mono text-slate-200 focus:outline-none focus:border-blue-500"
                                    value={simInputs.API7.imageUrl}
                                    onChange={(e) => updateSimInput('imageUrl', e.target.value)}
                                  />
                                  <span className="text-[10px] text-slate-500 mt-1.5 block">
                                    Try querying AWS internal EC2 metadata: <b>http://169.254.169.254/latest/meta-data/</b>
                                  </span>
                                </div>
                              </div>
                            )}

                            {/* API8: Security Misconfig */}
                            {selectedVuln.id === 'API8' && (
                              <div className="space-y-4">
                                <div className="flex items-center gap-2 bg-slate-950 p-2 rounded-lg border border-slate-800 font-mono text-xs text-slate-300">
                                  <span className="text-emerald-400 font-bold">GET</span>
                                  <span>/api/v1/debug/db-status</span>
                                </div>
                                <div className="text-xs text-slate-400 bg-slate-900/50 border border-slate-800 rounded-lg p-3">
                                  Clicking Send will trigger a simulated query execution exception in the database layer.
                                </div>
                              </div>
                            )}

                            {/* API9: Improper Inventory */}
                            {selectedVuln.id === 'API9' && (
                              <div className="space-y-4">
                                <div>
                                  <label className="block text-xs font-semibold text-slate-400 mb-1.5">Select Route Version</label>
                                  <div className="flex bg-slate-950 p-2 rounded-lg border border-slate-800 font-mono text-xs text-slate-300">
                                    <span className="text-emerald-400 font-bold mr-2">GET</span>
                                    <select
                                      className="bg-transparent text-slate-200 focus:outline-none flex-1 font-mono text-xs cursor-pointer"
                                      value={simInputs.API9.path}
                                      onChange={(e) => updateSimInput('path', e.target.value)}
                                    >
                                      <option className="bg-slate-950 text-slate-200" value="/api/v1/user/profile?id=101">GET /api/v1/user/profile?id=101 (Deprecated/Legacy)</option>
                                      <option className="bg-slate-950 text-slate-200" value="/api/v2/user/profile">GET /api/v2/user/profile (Current/Protected)</option>
                                    </select>
                                  </div>
                                  <span className="text-[10px] text-slate-500 mt-1 block">
                                    (Legacy routes often get neglected and left unpatched, leaving BOLA checks inactive)
                                  </span>
                                </div>
                              </div>
                            )}

                            {/* API10: Unsafe Consumption */}
                            {selectedVuln.id === 'API10' && (
                              <div className="space-y-4">
                                <div className="flex items-center gap-2 bg-slate-950 p-2 rounded-lg border border-slate-800 font-mono text-xs text-slate-300">
                                  <span className="text-amber-500 font-bold">POST</span>
                                  <span>/api/v1/weather/report</span>
                                </div>
                                <div>
                                  <label className="block text-xs font-semibold text-slate-400 mb-1.5">Third-Party Data Input</label>
                                  <input
                                    type="text"
                                    className="w-full bg-slate-900/60 border border-slate-800 rounded-lg p-2 text-xs font-mono text-slate-200 focus:outline-none focus:border-blue-500"
                                    value={simInputs.API10.forecast}
                                    onChange={(e) => updateSimInput('forecast', e.target.value)}
                                  />
                                  <span className="text-[10px] text-slate-500 mt-1 block">
                                    (Simulate unescaped data from integration. Try injecting SQL strings: <b>Rainy' OR 1=1 --</b>)
                                  </span>
                                </div>
                              </div>
                            )}

                          </div>
                          
                          <button
                            onClick={runSimulation}
                            className={`w-full py-2.5 rounded-xl font-semibold text-sm transition-all duration-200 border mt-6 shadow-md ${
                              simEngineSecure
                                ? 'bg-emerald-600 hover:bg-emerald-500 border-emerald-500/30 text-white shadow-emerald-500/5'
                                : 'bg-red-600 hover:bg-red-500 border-red-500/30 text-white shadow-red-500/5'
                            }`}
                          >
                            Send HTTP Request
                          </button>
                        </div>

                        {/* Terminal Response Console (Right Pane) */}
                        <div className="flex flex-col border border-slate-800 rounded-xl overflow-hidden min-h-[380px]">
                          
                          {/* Console Header */}
                          <div className="bg-slate-950/80 border-b border-slate-800/80 px-4 py-2 flex items-center justify-between">
                            <div className="flex items-center gap-2">
                              <span className="w-2.5 h-2.5 rounded-full bg-red-500"></span>
                              <span className="w-2.5 h-2.5 rounded-full bg-yellow-500"></span>
                              <span className="w-2.5 h-2.5 rounded-full bg-green-500"></span>
                              <span className="text-xs font-semibold text-slate-400 font-mono ml-2">Server Console & Output</span>
                            </div>
                            {simResponse && (
                              <span className={`text-[10px] font-mono px-2 py-0.5 rounded border ${
                                simResponse.status >= 400
                                  ? 'bg-red-950/40 text-red-400 border-red-900/40'
                                  : 'bg-emerald-950/40 text-emerald-400 border-emerald-900/40'
                              }`}>
                                HTTP {simResponse.status}
                              </span>
                            )}
                          </div>

                          {/* Console Screens */}
                          <div className="flex-1 bg-slate-950 p-4 font-mono text-[11px] flex flex-col gap-4 overflow-y-auto max-h-[320px]">
                            
                            {/* Execution Log */}
                            <div className="space-y-1">
                              <div className="text-[10px] uppercase font-bold tracking-wider text-slate-500 border-b border-slate-900 pb-1 mb-1">
                                Engine Process Logs
                              </div>
                              {simLogs.length === 0 ? (
                                <div className="text-slate-600 italic">Logs will display here after sending a request...</div>
                              ) : (
                                simLogs.map((log, idx) => (
                                  <div key={idx} className={`${
                                    log.includes('DENIED') || log.includes('ERROR') || log.includes('ALERT')
                                      ? 'text-red-400'
                                      : log.includes('WARNING')
                                      ? 'text-amber-400'
                                      : log.includes('SUCCESS')
                                      ? 'text-emerald-400'
                                      : 'text-slate-400'
                                  }`}>
                                    {log}
                                  </div>
                                ))
                              )}
                            </div>

                            {/* HTTP Response Body */}
                            <div className="space-y-1 mt-auto">
                              <div className="text-[10px] uppercase font-bold tracking-wider text-slate-500 border-b border-slate-900 pb-1 mb-1">
                                HTTP Response Body
                              </div>
                              {simResponse ? (
                                <pre className="text-slate-300 bg-black/45 p-2 rounded border border-slate-900/60 overflow-x-auto whitespace-pre-wrap select-all max-h-[140px]">
                                  {JSON.stringify(simResponse.body, null, 2)}
                                </pre>
                              ) : (
                                <div className="text-slate-600 italic">No response returned yet.</div>
                              )}
                            </div>

                          </div>
                        </div>

                      </div>
                    </div>
                  )}

                </div>
              </div>
            </main>
          </div>

          {/* Footer */}
          <footer className="border-t border-slate-900/80 bg-brand-dark/40 py-6 mt-12">
            <div className="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500">
              OWASP® API Security Top 10 (2023) is a registered trademark of the OWASP Foundation. This dashboard is for educational and training purposes.
            </div>
          </footer>
        </div>
      );
    }

    // Mount the application to the root container
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>

</body>
</html>
